# ChronosMesh — full-stack Docker Compose
#
# Brings up every containerizable service: PostgreSQL, Redis, the Rust
# Secure Core / Time Engine, the Go Scheduler Engine, the C# backend API,
# and the Next.js web app. The C++/Qt6 Desktop Client is a native Windows
# 11 application and is intentionally NOT containerized here — see
# README.markdown "Installation" for its separate CMake build.
#
# Usage: `docker compose up --build` from the repository root, after
# copying docker/.env.example to docker/.env and filling in real secrets.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chronosmesh}
      POSTGRES_USER: ${POSTGRES_USER:-chronosmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a POSTGRES_PASSWORD in docker/.env}
    volumes:
      - chronosmesh_postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chronosmesh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set a REDIS_PASSWORD in docker/.env}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"

  rust-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rust-core
    restart: unless-stopped
    environment:
      PORT: 7301
      CHRONOSMESH_MASTER_KEY: ${CHRONOSMESH_MASTER_KEY:?set a 32-byte hex CHRONOSMESH_MASTER_KEY in docker/.env}
    ports:
      - "${RUST_CORE_PORT:-7301}:7301"

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.scheduler
    restart: unless-stopped
    depends_on:
      - rust-core
    environment:
      SCHEDULER_PORT: 8081
      CORE_ENGINE_URL: http://rust-core:7301
      SCHEDULER_WORKER_COUNT: ${SCHEDULER_WORKER_COUNT:-64}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${SCHEDULER_PORT:-8081}:8081"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rust-core:
        condition: service_started
      scheduler:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      CHRONOSMESH_DB_CONNECTION: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-chronosmesh};Username=${POSTGRES_USER:-chronosmesh};Password=${POSTGRES_PASSWORD}"
      CHRONOSMESH_JWT_SECRET: ${CHRONOSMESH_JWT_SECRET:?set a long random CHRONOSMESH_JWT_SECRET in docker/.env}
      CORE_ENGINE_URL: http://rust-core:7301
      SCHEDULER_URL: http://scheduler:8081
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - backend
      - scheduler
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_SCHEDULER_WS_URL: ${PUBLIC_SCHEDULER_WS_URL:-ws://localhost:8081/v1/ws}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  chronosmesh_postgres_data:
