[package]
name = "chronosmesh-core"
version = "0.1.0"
edition = "2021"
description = "ChronosMesh Secure Core & Time Engine - timezone/DST-safe availability, recurrence, scheduling and cryptographic primitives"
license = "Apache-2.0"

[lib]
name = "chronosmesh_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "chronosmesh-core-server"
path = "src/bin/server.rs"

[dependencies]
chrono = { version = "=0.4.38", features = ["serde"] }
chrono-tz = "=0.9.0"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
uuid = { version = "=1.10.0", features = ["v4", "serde"] }
sha2 = "=0.10.8"
argon2 = "=0.5.3"
aes-gcm = "=0.10.3"
rand = "=0.8.5"
getrandom = "=0.2.15"
thiserror = "=1.0.64"
axum = "=0.7.7"
tokio = { version = "=1.40.0", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "=0.5.2", features = ["cors", "trace"] }
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
base64 = "=0.22.1"
base64ct = "=1.6.0"
